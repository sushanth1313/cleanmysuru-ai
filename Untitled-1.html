<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Mysore Palace | Where Royalty Lives Forever</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=Inter:wght@300;400;500&display=swap" rel="stylesheet" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #050510;
    color: #fff;
    font-family: 'Inter', sans-serif;
  }

  #canvas-container {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    z-index: 1;
  }

  /* ---------- Loading Screen ---------- */
  #loader {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #050510;
    transition: opacity 1.2s ease, visibility 1.2s ease;
  }
  #loader.hidden {
    opacity: 0;
    visibility: hidden;
  }
  #loader h1 {
    font-family: 'Playfair Display', serif;
    font-size: clamp(2rem, 6vw, 4rem);
    letter-spacing: 0.3em;
    color: #ffb838;
    margin-bottom: 30px;
    text-shadow: 0 0 40px rgba(255, 158, 10, 0.5);
  }
  .bar-track {
    width: 260px;
    height: 1px;
    background: rgba(255, 184, 56, 0.2);
    position: relative;
    overflow: hidden;
  }
  .bar-fill {
    position: absolute;
    top: 0; left: 0;
    height: 100%;
    width: 0%;
    background: #ffb838;
    box-shadow: 0 0 12px #ffb838;
    transition: width 2.4s cubic-bezier(0.4, 0, 0.2, 1);
  }
  #loader p {
    margin-top: 24px;
    font-size: 0.7rem;
    letter-spacing: 0.4em;
    text-transform: uppercase;
    color: rgba(255, 231, 173, 0.6);
    opacity: 0;
    transition: opacity 1s ease 0.8s;
  }
  #loader p.show { opacity: 1; }

  /* ---------- Overlay / Hero ---------- */
  #overlay {
    position: fixed;
    inset: 0;
    z-index: 10;
    pointer-events: none;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 20px;
    opacity: 0;
    transition: opacity 1.5s ease 0.3s;
  }
  #overlay.show { opacity: 1; }

  #overlay h1 {
    font-family: 'Playfair Display', serif;
    font-size: clamp(2.5rem, 9vw, 8rem);
    font-weight: 700;
    letter-spacing: 0.08em;
    color: #ffb838;
    text-shadow: 0 0 60px rgba(255, 158, 10, 0.4), 0 0 20px rgba(255, 158, 10, 0.3);
    line-height: 1;
    margin-bottom: 20px;
  }

  #overlay .subtitle {
    font-size: clamp(0.7rem, 1.6vw, 1.05rem);
    letter-spacing: 0.5em;
    text-transform: uppercase;
    color: rgba(255, 231, 173, 0.85);
    font-weight: 300;
  }

  #overlay .cta {
    margin-top: 50px;
    pointer-events: auto;
    padding: 14px 40px;
    border: 1px solid rgba(255, 184, 56, 0.5);
    color: #ffb838;
    font-size: 0.7rem;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    background: transparent;
    cursor: pointer;
    transition: all 0.5s ease;
    font-family: 'Inter', sans-serif;
  }
  #overlay .cta:hover {
    background: #ffb838;
    color: #050510;
    box-shadow: 0 0 40px rgba(255, 184, 56, 0.6);
    letter-spacing: 0.4em;
  }

  /* ---------- Bottom Info Bar ---------- */
  #footer-info {
    position: fixed;
    bottom: 24px;
    left: 0; right: 0;
    z-index: 10;
    display: flex;
    justify-content: space-between;
    padding: 0 40px;
    font-size: 0.65rem;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: rgba(255, 231, 173, 0.4);
    opacity: 0;
    transition: opacity 1.5s ease 1.5s;
  }
  #footer-info.show { opacity: 1; }

  @media (max-width: 640px) {
    #footer-info { padding: 0 20px; font-size: 0.55rem; }
    #overlay .cta { padding: 12px 28px; font-size: 0.6rem; }
  }
</style>
</head>
<body>

  <!-- Loading Screen -->
  <div id="loader">
    <h1>MYSORE PALACE</h1>
    <div class="bar-track"><div class="bar-fill" id="barFill"></div></div>
    <p id="loaderTag">Where Royalty Lives Forever</p>
  </div>

  <!-- 3D Canvas -->
  <div id="canvas-container"></div>

  <!-- Hero Overlay -->
  <div id="overlay">
    <h1>MYSORE PALACE</h1>
    <p class="subtitle">Where Royalty Lives Forever</p>
    <button class="cta" onclick="focusPalace()">Explore The Palace</button>
  </div>

  <!-- Footer Info -->
  <div id="footer-info">
    <span>Karnataka · India</span>
    <span>Est. 1897</span>
  </div>

  <!-- Three.js from CDN -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
    import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
    import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

    // ---------------- Scene Setup ----------------
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x050510);
    scene.fog = new THREE.Fog(0x050510, 14, 40);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 200);
    camera.position.set(0, 3, 18);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.1;
    container.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.enablePan = false;
    controls.minDistance = 10;
    controls.maxDistance = 30;
    controls.maxPolarAngle = Math.PI / 2.1;
    controls.target.set(0, 2.5, 0);
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.35;

    // ---------------- Post-processing (Bloom for glow) ----------------
    const composer = new EffectComposer(renderer);
    composer.addPass(new RenderPass(scene, camera));
    const bloom = new UnrealBloomPass(
      new THREE.Vector2(window.innerWidth, window.innerHeight),
      0.9,   // strength
      0.6,   // radius
      0.2    // threshold
    );
    composer.addPass(bloom);

    // ---------------- Lighting ----------------
    scene.add(new THREE.AmbientLight(0x223355, 0.6));

    const keyLight = new THREE.SpotLight(0xffb838, 120, 60, Math.PI / 4, 0.6, 1.5);
    keyLight.position.set(0, 18, 10);
    keyLight.castShadow = true;
    keyLight.shadow.mapSize.set(2048, 2048);
    keyLight.shadow.bias = -0.0005;
    scene.add(keyLight);

    const fillLeft = new THREE.PointLight(0xff9e0a, 45, 40);
    fillLeft.position.set(-10, 6, 8);
    scene.add(fillLeft);

    const fillRight = new THREE.PointLight(0xff9e0a, 45, 40);
    fillRight.position.set(10, 6, 8);
    scene.add(fillRight);

    const rimLight = new THREE.DirectionalLight(0x6688ff, 0.4);
    rimLight.position.set(0, 8, -15);
    scene.add(rimLight);

    // ---------------- Materials ----------------
    const goldMat = new THREE.MeshStandardMaterial({
      color: 0xffb838,
      emissive: 0xff9e0a,
      emissiveIntensity: 0.85,
      metalness: 0.9,
      roughness: 0.25,
    });

    const darkMat = new THREE.MeshStandardMaterial({
      color: 0x1a1a2e,
      metalness: 0.3,
      roughness: 0.8,
    });

    const domeMat = new THREE.MeshStandardMaterial({
      color: 0xffc857,
      emissive: 0xff8c00,
      emissiveIntensity: 1.1,
      metalness: 0.95,
      roughness: 0.15,
    });

    // ---------------- Palace Model ----------------
    const palace = new THREE.Group();

    // Base platform
    const base = new THREE.Mesh(new THREE.BoxGeometry(13, 1, 9), darkMat);
    base.position.y = 0.5;
    base.receiveShadow = true;
    palace.add(base);

    // Main building block
    const mainBlock = new THREE.Mesh(new THREE.BoxGeometry(12, 3, 8), darkMat);
    mainBlock.position.y = 2.5;
    mainBlock.castShadow = true;
    mainBlock.receiveShadow = true;
    palace.add(mainBlock);

    // Golden facade strip
    const facade = new THREE.Mesh(new THREE.BoxGeometry(11.5, 0.6, 0.3), goldMat);
    facade.position.set(0, 3.5, 4.15);
    facade.castShadow = true;
    palace.add(facade);

    // Second facade strip
    const facade2 = new THREE.Mesh(new THREE.BoxGeometry(11.5, 0.6, 0.3), goldMat);
    facade2.position.set(0, 2.2, 4.15);
    palace.add(facade2);

    // Rooftop golden ledge
    const ledge = new THREE.Mesh(new THREE.BoxGeometry(12.5, 0.4, 8.5), goldMat);
    ledge.position.y = 4.1;
    ledge.castShadow = true;
    palace.add(ledge);

    // ---------- Central Dome ----------
    const centralDomeBase = new THREE.Mesh(new THREE.CylinderGeometry(2, 2.2, 1.2, 32), goldMat);
    centralDomeBase.position.y = 4.9;
    centralDomeBase.castShadow = true;
    palace.add(centralDomeBase);

    const centralDome = new THREE.Mesh(
      new THREE.SphereGeometry(2, 32, 24, 0, Math.PI * 2, 0, Math.PI / 2),
      domeMat
    );
    centralDome.position.y = 5.5;
    centralDome.castShadow = true;
    palace.add(centralDome);

    // Spire above central dome
    const spire = new THREE.Mesh(new THREE.ConeGeometry(0.35, 1.5, 12), goldMat);
    spire.position.y = 8.2;
    spire.castShadow = true;
    palace.add(spire);

    const spireBall = new THREE.Mesh(new THREE.SphereGeometry(0.18, 16, 16), goldMat);
    spireBall.position.y = 9.1;
    palace.add(spireBall);

    // ---------- Side Towers (left and right, symmetric) ----------
    function makeSideTower(xPos) {
      const tower = new THREE.Group();

      // Tower body
      const body = new THREE.Mesh(new THREE.BoxGeometry(2.4, 5, 2.4), darkMat);
      body.position.y = 2.5;
      body.castShadow = true;
      body.receiveShadow = true;
      tower.add(body);

      // Golden panels on tower
      const panel1 = new THREE.Mesh(new THREE.BoxGeometry(2.5, 0.3, 2.5), goldMat);
      panel1.position.y = 3.5;
      tower.add(panel1);
      const panel2 = new THREE.Mesh(new THREE.BoxGeometry(2.5, 0.3, 2.5), goldMat);
      panel2.position.y = 1.8;
      tower.add(panel2);

      // Tower dome base
      const domeBase = new THREE.Mesh(new THREE.CylinderGeometry(1.3, 1.5, 0.9, 24), goldMat);
      domeBase.position.y = 5.4;
      domeBase.castShadow = true;
      tower.add(domeBase);

      // Tower dome
      const dome = new THREE.Mesh(
        new THREE.SphereGeometry(1.3, 32, 24, 0, Math.PI * 2, 0, Math.PI / 2),
        domeMat
      );
      dome.position.y = 5.9;
      dome.castShadow = true;
      tower.add(dome);

      // Small spire
      const smallSpire = new THREE.Mesh(new THREE.ConeGeometry(0.22, 1, 10), goldMat);
      smallSpire.position.y = 7.6;
      tower.add(smallSpire);

      tower.position.set(xPos, 0, 0);
      return tower;
    }

    palace.add(makeSideTower(-5.5));
    palace.add(makeSideTower(5.5));

    // ---------- Mid Domes (smaller, between central and side towers) ----------
    function makeMidDome(xPos) {
      const g = new THREE.Group();
      const domeBase = new THREE.Mesh(new THREE.CylinderGeometry(0.9, 1.05, 0.7, 24), goldMat);
      domeBase.position.y = 4.6;
      g.add(domeBase);
      const dome = new THREE.Mesh(
        new THREE.SphereGeometry(0.9, 24, 18, 0, Math.PI * 2, 0, Math.PI / 2),
        domeMat
      );
      dome.position.y = 5.0;
      dome.castShadow = true;
      g.add(dome);
      const tip = new THREE.Mesh(new THREE.ConeGeometry(0.15, 0.7, 8), goldMat);
      tip.position.y = 6.1;
      g.add(tip);
      g.position.set(xPos, 0, 0);
      return g;
    }

    palace.add(makeMidDome(-2.8));
    palace.add(makeMidDome(2.8));

    // ---------- Front Archway (entrance) ----------
    const archGroup = new THREE.Group();

    const entranceBase = new THREE.Mesh(new THREE.BoxGeometry(3.5, 2.5, 0.4), goldMat);
    entranceBase.position.set(0, 2.2, 4.1);
    entranceBase.castShadow = true;
    palace.add(entranceBase);

    const entranceArch = new THREE.Mesh(
      new THREE.TorusGeometry(1, 0.18, 12, 24, Math.PI),
      goldMat
    );
    entranceArch.position.set(0, 3.5, 4.35);
    entranceArch.castShadow = true;
    palace.add(entranceArch);

    // ---------- Front Columns (row of pillars) ----------
    const pillarXs = [-4.5, -3.5, -2.5, -1.5, 1.5, 2.5, 3.5, 4.5];
    pillarXs.forEach((x) => {
      const pillar = new THREE.Mesh(
        new THREE.CylinderGeometry(0.18, 0.22, 2.2, 10),
        goldMat
      );
      pillar.position.set(x, 2.2, 4.3);
      pillar.castShadow = true;
      palace.add(pillar);

      // Capital
      const cap = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.2, 0.5), goldMat);
      cap.position.set(x, 3.4, 4.3);
      palace.add(cap);

      // Base
      const pBase = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.2, 0.5), goldMat);
      pBase.position.set(x, 1.1, 4.3);
      palace.add(pBase);
    });

    // ---------- Arches between pillars ----------
    const archXs = [-4, -3, -2, 2, 3, 4];
    archXs.forEach((x) => {
      const arch = new THREE.Mesh(
        new THREE.TorusGeometry(0.5, 0.08, 8, 16, Math.PI),
        goldMat
      );
      arch.position.set(x, 3.2, 4.35);
      palace.add(arch);
    });

    // ---------- Small decorative spikes along the roofline ----------
    for (let i = -5; i <= 5; i++) {
      if (Math.abs(i) < 1) continue;
      const spike = new THREE.Mesh(new THREE.ConeGeometry(0.08, 0.5, 6), goldMat);
      spike.position.set(i * 1.05, 4.45, 4.05);
      palace.add(spike);
    }

    // ---------- Floating Sparkle Particles ----------
    const sparkleCount = 220;
    const sparkleGeo = new THREE.BufferGeometry();
    const positions = new Float32Array(sparkleCount * 3);
    for (let i = 0; i < sparkleCount; i++) {
      positions[i * 3]     = (Math.random() - 0.5) * 30;
      positions[i * 3 + 1] = Math.random() * 12 + 1;
      positions[i * 3 + 2] = (Math.random() - 0.5) * 20;
    }
    sparkleGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));

    const sparkleMat = new THREE.PointsMaterial({
      color: 0xffd478,
      size: 0.09,
      transparent: true,
      opacity: 0.8,
      blending: THREE.AdditiveBlending,
      depthWrite: false,
    });
    const sparkles = new THREE.Points(sparkleGeo, sparkleMat);
    scene.add(sparkles);

    // ---------- Ground reflection plane ----------
    const groundGeo = new THREE.CircleGeometry(40, 64);
    const groundMat = new THREE.MeshStandardMaterial({
      color: 0x0a0a1a,
      metalness: 0.9,
      roughness: 0.4,
    });
    const ground = new THREE.Mesh(groundGeo, groundMat);
    ground.rotation.x = -Math.PI / 2;
    ground.position.y = 0;
    ground.receiveShadow = true;
    scene.add(ground);

    // Add palace to scene
    palace.position.y = 0;
    scene.add(palace);

    // ---------------- Animation Loop ----------------
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const t = clock.getElapsedTime();

      // Subtle float of the palace
      palace.position.y = Math.sin(t * 0.5) * 0.06;

      // Animate sparkles (rotate + drift upward)
      sparkles.rotation.y = t * 0.03;
      const posAttr = sparkleGeo.attributes.position;
      for (let i = 0; i < sparkleCount; i++) {
        const yIdx = i * 3 + 1;
        let y = posAttr.array[yIdx] + 0.006;
        if (y > 13) y = 1;
        posAttr.array[yIdx] = y;
      }
      posAttr.needsUpdate = true;

      // Pulse the emissive on the domes for a "breathing light" effect
      const pulse = 1.0 + Math.sin(t * 1.2) * 0.15;
      domeMat.emissiveIntensity = pulse;
      goldMat.emissiveIntensity = 0.7 + Math.sin(t * 1.2) * 0.1;

      controls.update();
      composer.render();
    }
    animate();

    // ---------------- Resize Handler ----------------
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      composer.setSize(window.innerWidth, window.innerHeight);
    });

    // ---------------- Focus Button ----------------
    window.focusPalace = function () {
      controls.autoRotate = true;
      controls.autoRotateSpeed = 1.5;
      // Zoom in slightly for a cinematic effect
      const startPos = camera.position.clone();
      const endPos = new THREE.Vector3(0, 4, 12);
      const startTime = performance.now();
      const duration = 1500;

      function zoomStep() {
        const elapsed = performance.now() - startTime;
        const p = Math.min(elapsed / duration, 1);
        const eased = 1 - Math.pow(1 - p, 3);
        camera.position.lerpVectors(startPos, endPos, eased);
        if (p < 1) requestAnimationFrame(zoomStep);
      }
      zoomStep();
    };

    // ---------------- Loading Sequence ----------------
    window.addEventListener('load', () => {
      // Start the loading bar
      requestAnimationFrame(() => {
        document.getElementById('barFill').style.width = '100%';
        document.getElementById('loaderTag').classList.add('show');
      });

      // After ~2.8s hide loader and reveal overlay
      setTimeout(() => {
        document.getElementById('loader').classList.add('hidden');
        document.getElementById('overlay').classList.add('show');
        document.getElementById('footer-info').classList.add('show');
      }, 2800);
    });
  </script>

</body>
</html>
